services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess}
      POSTGRES_DB: ${POSTGRES_DB:-chess_assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to host in production; keep optional for local migrate tools.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess} -d ${POSTGRES_DB:-chess_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    expose:
      - "5050"
    # Local access without Caddy (prod still reaches web via the Docker network).
    ports:
      - "${APP_PORT:-5050}:5050"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD:-chess}@db:5432/${POSTGRES_DB:-chess_assistant}
      HOST: 0.0.0.0
      PORT: 5050
      OPEN_BROWSER: "0"
      SECRET_KEY: ${SECRET_KEY:-dev-change-me-in-production}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-hladii.b.v@gmail.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-chess123}
      SEED_USER_NAME: ${SEED_USER_NAME:-hladii}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    mem_limit: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
